name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy through.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      stack:
        description: Pulumi stack to deploy.
        required: true
        default: dev
        type: string
      apply_infra:
        description: Apply Pulumi infrastructure changes before releasing the API image.
        required: true
        default: true
        type: boolean
      release_api:
        description: Build, push, migrate, and deploy the API image.
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  PULUMI_STACK: ${{ inputs.stack || 'dev' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Typecheck infra
        run: pnpm infra:typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  apply-infra:
    name: Apply Infra
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.apply_infra }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'dev' }}
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Apply stack
        run: pnpm infra:deploy

  release-api:
    name: Release API
    needs:
      - validate
      - apply-infra
    if: ${{ always() && needs.validate.result == 'success' && (needs.apply-infra.result == 'success' || needs.apply-infra.result == 'skipped') && (github.event_name == 'push' || inputs.release_api) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'dev' }}
    env:
      API_IMAGE_TAG: ${{ github.sha }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Build, migrate, and deploy API
        run: pnpm infra:release:api
