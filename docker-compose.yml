services:
  postgres:
    image: postgres:16-alpine
    container_name: live-every-day-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: live_every_day
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d live_every_day"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
